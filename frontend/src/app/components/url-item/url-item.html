<div class="url-item">
  @if(!isEditing()) {
    <div class="url-info">
      <div class="url-details">
        <div class="url-row">
          <span class="url-label original">Original</span>
          <a [href]="url().url" target="_blank" class="url-link">{{ url().url }}</a>
        </div>
        <div class="url-row">
          <span class="url-label short">Corta</span>
          <a [href]="shortUrl" target="_blank" class="url-link short-link">{{ shortUrl }}</a>
        </div>
        <div class="url-meta">
          <span class="meta-chip">
            <span>👁</span>
            {{ url().accessCount }} visitas
          </span>
          <span class="meta-chip">
            <span>📅</span>
            {{ url().createdAt | date:'dd MMM yyyy' }}
          </span>
        </div>
      </div>

      <div class="actions">
        <button (click)="copyToClipboard()" class="btn btn-copy" title="Copiar">
          📋
        </button>
        <button (click)="startEdit()" class="btn btn-edit" title="Editar">
          ✏️
        </button>
        <button (click)="deletedUrl()" [disabled]="loading()" class="btn btn-delete" title="Eliminar">
          🗑️
        </button>
      </div>
    </div>
  } @else {
    <div class="url-edit">
      <span class="edit-label">Editar</span>
      <div class="edit-input-wrapper">
        <input
          type="url"
          [(ngModel)]="editUrl"
          [disabled]="loading()"
          placeholder="Nueva URL"
        />
      </div>
      <div class="edit-actions">
        <button (click)="saveEdit()" [disabled]="loading()" class="btn btn-save">
          ✓ Guardar
        </button>
        <button (click)="cancelEdit()" [disabled]="loading()" class="btn btn-cancel">
          Cancelar
        </button>
      </div>
    </div>
  }
</div>
